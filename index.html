<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>ATLAS Music</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#0b0d12">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="ATLAS Music"
  >

  <link
    rel="apple-touch-icon"
    href="icon-192.png"
  >

  <script
    src="jsmediatags.min.js"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #07090d;
      --panel: rgba(18, 21, 29, 0.92);
      --panel2: rgba(26, 30, 41, 0.92);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f7fb;
      --muted: #8e96a8;

      --blue: #35a7ff;
      --blue2: #126cff;

      --red: #ff405c;
      --red2: #ba1638;

      --smoke-left: rgba(53, 167, 255, 0.34);
      --smoke-right: rgba(255, 64, 92, 0.32);
      --theme-left: #35a7ff;
      --theme-right: #ff405c;
      --neon: #35a7ff;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(24, 109, 255, 0.13),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 4%,
          rgba(255, 40, 75, 0.11),
          transparent 28%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       ATLAS BANNER
    ========================= */

    #atlasBanner {
      position: relative;
      overflow: hidden;

      margin:
        calc(env(safe-area-inset-top) + 10px)
        14px
        10px;

      padding: 22px 18px 20px;

      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(21, 28, 40, 0.96),
          rgba(8, 10, 15, 0.98)
        );

      box-shadow:
        0 18px 50px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    #atlasBanner::before {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      top: -120px;
      left: -60px;

      border-radius: 50%;

      background: rgba(41, 137, 255, 0.22);

      filter: blur(45px);
    }

    #atlasBanner::after {
      content: "";

      position: absolute;

      width: 210px;
      height: 210px;

      top: -115px;
      right: -60px;

      border-radius: 50%;

      background: rgba(255, 42, 76, 0.18);

      filter: blur(45px);
    }

    .atlasInner {
      position: relative;
      z-index: 2;
    }

    .atlasTopRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .atlasLogoWrap {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .atlasMark {
      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      border-radius: 15px;

      font-size: 23px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          rgba(47, 151, 255, 0.20),
          rgba(255, 55, 86, 0.16)
        );

      border: 1px solid rgba(255,255,255,0.10);

      box-shadow:
        0 0 20px rgba(31, 127, 255, 0.16);
    }

    .atlasTitleBlock {
      line-height: 1;
    }

    .atlasTitle {
      font-size: 28px;
      font-weight: 850;

      letter-spacing: 0.18em;

      margin: 0;

      text-shadow:
        0 0 18px rgba(64, 153, 255, 0.16);
    }

    .atlasSubTitle {
      margin-top: 6px;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.48em;

      color: var(--muted);
    }

    .atlasStatus {
      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.08em;

      padding: 7px 10px;

      border-radius: 99px;

      color: #cfe8ff;

      background: rgba(39, 130, 255, 0.10);

      border: 1px solid rgba(62, 150, 255, 0.20);
    }

    .atlasLine {
      position: relative;

      height: 2px;

      margin-top: 18px;

      border-radius: 99px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--blue),
          rgba(255,255,255,0.72),
          var(--red),
          transparent
        );

      opacity: 0.85;
    }

    .atlasLine::after {
      content: "";

      position: absolute;

      top: -2px;
      left: 0;

      width: 80px;
      height: 6px;

      border-radius: 99px;

      background: rgba(255,255,255,0.5);

      filter: blur(6px);

      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      from {
        transform: translateX(-90px);
      }

      to {
        transform: translateX(calc(100vw - 30px));
      }
    }

    /* =========================
       HEADER CONTROLS
    ========================= */

    header {
      position: sticky;
      top: 0;

      z-index: 30;

      padding:
        max(8px, env(safe-area-inset-top))
        14px
        12px;

      background:
        linear-gradient(
          to bottom,
          rgba(7,9,13,0.96),
          rgba(7,9,13,0.88)
        );

      backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255,255,255,0.05);
    }

    #fileInput {
      width: 100%;

      margin-bottom: 10px;

      padding: 10px;

      color: var(--muted);

      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: 13px;
    }

    #search {
      width: 100%;

      padding: 13px 14px;

      color: white;

      background: rgba(25, 28, 37, 0.92);

      border:
        1px solid rgba(255,255,255,0.08);

      border-radius: 14px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    #search:focus {
      border-color:
        rgba(62, 149, 255, 0.55);

      box-shadow:
        0 0 0 3px rgba(33, 122, 255, 0.10);
    }

    #tabs {
      display: flex;

      gap: 8px;

      margin-top: 10px;
    }

    .tab-btn {
      flex: 1;

      padding: 11px;

      color: #abb2c2;

      background: rgba(25, 28, 37, 0.85);

      border:
        1px solid rgba(255,255,255,0.07);

      border-radius: 12px;

      cursor: pointer;
    }

    .tab-btn.active {
      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(46, 134, 255, 0.30),
          rgba(33, 39, 53, 0.96)
        );

      border-color:
        rgba(75, 151, 255, 0.35);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    #status {
      margin-top: 9px;

      font-size: 12px;

      color: var(--muted);
    }

    /* =========================
       CONTENT
    ========================= */

    #content {
      padding: 12px 14px 235px;
    }

    .song {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 11px;

      margin-bottom: 10px;

      background:
        linear-gradient(
          135deg,
          rgba(23, 27, 36, 0.96),
          rgba(15, 18, 24, 0.96)
        );

      border:
        1px solid rgba(255,255,255,0.065);

      border-radius: 16px;

      box-shadow:
        0 6px 18px rgba(0,0,0,0.18);

      transition:
        transform 0.15s,
        border-color 0.15s;
    }

    .song:active {
      transform: scale(0.99);
    }

    .song.playing {
      border-color:
        rgba(59, 144, 255, 0.50);

      background:
        linear-gradient(
          135deg,
          rgba(28, 51, 83, 0.94),
          rgba(17, 21, 30, 0.98)
        );

      box-shadow:
        0 0 22px rgba(30, 106, 255, 0.10);
    }

    .art {
      width: 64px;
      height: 64px;

      min-width: 64px;

      object-fit: cover;

      border-radius: 13px;

      background: #242833;

      box-shadow:
        0 5px 16px rgba(0,0,0,0.28);

      cursor: pointer;
    }

    .song-info {
      flex: 1;

      min-width: 0;

      cursor: pointer;
    }

    .song-title {
      font-size: 16px;
      font-weight: 750;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist,
    .song-album {
      margin-top: 4px;

      font-size: 12px;

      color: var(--muted);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-buttons {
      display: flex;
      flex-direction: column;

      gap: 6px;
    }

    .small-btn {
      padding: 7px 9px;

      color: #dbe0ea;

      background: rgba(43, 48, 61, 0.92);

      border:
        1px solid rgba(255,255,255,0.06);

      border-radius: 9px;

      cursor: pointer;
    }

    .playlist-add-btn {
      color: #cce3ff;

      background:
        rgba(38, 105, 196, 0.26);
    }

    .remove-btn {
      color: #ffc5cd;

      background:
        rgba(128, 38, 53, 0.32);
    }

    /* =========================
       PLAYLISTS
    ========================= */

    .playlist-header-row {
      display: flex;

      margin-bottom: 12px;
    }

    #newPlaylistButton {
      width: 100%;

      padding: 13px;

      color: white;

      font-weight: 750;

      background:
        linear-gradient(
          135deg,
          rgba(31, 108, 219, 0.85),
          rgba(27, 70, 135, 0.90)
        );

      border:
        1px solid rgba(90, 164, 255, 0.26);

      border-radius: 13px;

      cursor: pointer;
    }

    .playlist-card {
      padding: 16px;

      margin-bottom: 10px;

      background:
        linear-gradient(
          135deg,
          rgba(24, 28, 38, 0.96),
          rgba(15, 18, 24, 0.96)
        );

      border:
        1px solid rgba(255,255,255,0.07);

      border-radius: 16px;

      cursor: pointer;
    }

    .playlist-name {
      font-size: 17px;
      font-weight: 750;
    }

    .playlist-count {
      margin-top: 5px;

      font-size: 12px;

      color: var(--muted);
    }

    .playlist-view-header {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-bottom: 14px;
    }

    .playlist-view-header h2 {
      flex: 1;

      margin: 0;

      font-size: 21px;
    }

    #backPlaylistsButton,
    .danger-btn {
      padding: 9px 11px;

      color: white;

      border: none;
      border-radius: 10px;

      cursor: pointer;
    }

    #backPlaylistsButton {
      background: #2a2f3a;
    }

    .danger-btn {
      background:
        rgba(144, 37, 54, 0.65);
    }

    #emptyMessage {
      margin-top: 50px;

      text-align: center;

      color: var(--muted);
    }

    /* =========================
       PLAYER
    ========================= */

    #player {
      position: fixed;

      left: 10px;
      right: 10px;
      bottom:
        max(
          10px,
          env(safe-area-inset-bottom)
        );

      z-index: 50;

      padding: 11px 12px 12px;

      background:
        rgba(18, 21, 29, 0.94);

      backdrop-filter: blur(20px);

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 20px;

      box-shadow:
        0 16px 40px rgba(0,0,0,0.52);
    }

    #nowPlayingRow {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-bottom: 8px;
    }

    #nowPlayingArt {
      width: 48px;
      height: 48px;

      object-fit: cover;

      border-radius: 10px;

      background: #252a34;
    }

    #nowPlayingText {
      flex: 1;

      min-width: 0;
    }

    #nowPlayingTitle {
      font-size: 14px;
      font-weight: 750;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #nowPlayingArtist {
      margin-top: 3px;

      font-size: 12px;

      color: var(--muted);
    }

    #playbackButtons {
      display: flex;
      justify-content: center;

      gap: 8px;

      margin-bottom: 8px;
    }

    .player-btn {
      min-width: 47px;

      padding: 8px 10px;

      color: #e6e9f0;

      background:
        rgba(44, 49, 63, 0.92);

      border:
        1px solid rgba(255,255,255,0.06);

      border-radius: 10px;

      cursor: pointer;
    }

    .player-btn.active {
      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(44, 132, 255, 0.78),
          rgba(42, 83, 153, 0.86)
        );

      border-color:
        rgba(84, 156, 255, 0.38);
    }

    #repeatButton {
      min-width: 94px;
    }

    audio {
      width: 100%;
      height: 34px;
    }

    /* =========================
       MODALS
    ========================= */

    .modal-backdrop {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 100;

      align-items: center;
      justify-content: center;

      padding: 15px;

      background:
        rgba(0,0,0,0.78);

      backdrop-filter: blur(8px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(500px, 100%);

      max-height: 92vh;

      overflow-y: auto;

      padding: 20px;

      background:
        linear-gradient(
          145deg,
          #171b24,
          #101319
        );

      border:
        1px solid rgba(255,255,255,0.09);

      border-radius: 20px;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.65);
    }

    .modal h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;

      margin-bottom: 6px;

      font-size: 12px;

      color: var(--muted);
    }

    .field input[type="text"] {
      width: 100%;

      padding: 12px;

      color: white;

      background:
        rgba(39, 44, 56, 0.92);

      border:
        1px solid rgba(255,255,255,0.07);

      border-radius: 11px;

      outline: none;
    }

    #coverPreview {
      display: block;

      width: 170px;
      height: 170px;

      margin:
        0 auto 15px;

      object-fit: cover;

      border-radius: 17px;

      background: #252a34;

      box-shadow:
        0 12px 30px rgba(0,0,0,0.35);
    }

    #coverInput {
      width: 100%;
    }

    .modal-actions {
      display: flex;

      gap: 10px;

      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;

      padding: 12px;

      border: none;
      border-radius: 11px;

      cursor: pointer;
    }

    .cancel-btn {
      color: white;

      background:
        #303541;
    }

    .save-btn {
      color: white;

      font-weight: 750;

      background:
        linear-gradient(
          135deg,
          #2b86ff,
          #155dcc
        );
    }

    #deleteSongButton {
      width: 100%;

      margin-top: 12px;

      padding: 11px;

      color: white;

      background:
        rgba(145, 36, 54, 0.80);

      border: none;
      border-radius: 11px;

      cursor: pointer;
    }

    .playlist-choice {
      padding: 12px;

      margin-bottom: 8px;

      background:
        rgba(42, 47, 60, 0.92);

      border:
        1px solid rgba(255,255,255,0.05);

      border-radius: 11px;

      cursor: pointer;
    }


    /* =========================
       LIBRARY BACKUP / RESTORE
    ========================= */

    #libraryTools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .library-tool-btn {
      padding: 10px 12px;
      color: #dce8f8;
      background: rgba(25, 28, 37, 0.88);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      cursor: pointer;
    }

    .library-tool-btn:active {
      transform: scale(0.99);
    }

    #exportBackupButton {
      border-color: rgba(53, 167, 255, 0.24);
    }

    #restoreBackupButton {
      border-color: rgba(255, 64, 92, 0.20);
    }

    #restoreBackupInput {
      display: none;
    }

    /* =========================
       ATLAS AMBIENT THEME
    ========================= */

    #ambientBackground {
      position: fixed;
      inset: 0;
      z-index: -5;
      pointer-events: none;
      overflow: hidden;
      background: #07090d;
    }

    .smokeBlob {
      position: absolute;
      width: 78vw;
      height: 78vw;
      max-width: 760px;
      max-height: 760px;
      border-radius: 50%;
      filter: blur(62px);
      opacity: 1;
      will-change: transform;
    }

    .smokeBlob.left {
      left: -34vw;
      top: 5vh;
      background: var(--smoke-left);
      animation: atlasSmokeLeft 15s ease-in-out infinite alternate;
    }

    .smokeBlob.right {
      right: -36vw;
      top: 22vh;
      background: var(--smoke-right);
      animation: atlasSmokeRight 18s ease-in-out infinite alternate;
    }

    .smokeBlob.center {
      width: 55vw;
      height: 55vw;
      left: 24vw;
      bottom: -24vw;
      background: color-mix(in srgb, var(--neon) 30%, transparent);
      opacity: 0.68;
      animation: atlasSmokeCenter 20s ease-in-out infinite alternate;
    }

    #neonFrame {
      position: fixed;
      inset: 5px;
      z-index: 90;
      pointer-events: none;
      border-radius: 24px;
      border: 3px solid color-mix(in srgb, var(--neon) 82%, white 8%);
      box-shadow:
        inset 0 0 18px color-mix(in srgb, var(--neon) 46%, transparent),
        inset 0 0 42px color-mix(in srgb, var(--neon) 16%, transparent),
        0 0 10px color-mix(in srgb, var(--neon) 82%, transparent),
        0 0 28px color-mix(in srgb, var(--neon) 50%, transparent),
        0 0 54px color-mix(in srgb, var(--neon) 22%, transparent);
      opacity: 0.96;
    }

    @keyframes atlasSmokeLeft {
      from { transform: translate3d(-5%, -4%, 0) scale(0.92); }
      to { transform: translate3d(18%, 12%, 0) scale(1.14); }
    }

    @keyframes atlasSmokeRight {
      from { transform: translate3d(8%, -8%, 0) scale(1); }
      to { transform: translate3d(-16%, 18%, 0) scale(1.18); }
    }

    @keyframes atlasSmokeCenter {
      from { transform: translate3d(-12%, 8%, 0) scale(0.88); }
      to { transform: translate3d(10%, -14%, 0) scale(1.1); }
    }

    body {
      background: rgba(7, 9, 13, 0.76);
    }

    #atlasBanner {
      box-shadow:
        0 18px 50px rgba(0,0,0,0.4),
        0 0 28px color-mix(in srgb, var(--neon) 14%, transparent),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* =========================
       MINI PLAYER
    ========================= */

    #nowPlayingRow {
      margin-bottom: 0;
    }

    #player.expanded #nowPlayingRow {
      margin-bottom: 8px;
    }

    .miniControls {
      display: none;
      align-items: center;
      gap: 5px;
    }

    #player.collapsed .miniControls {
      display: flex;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      color: #f5f7fb;
      background: rgba(43, 48, 61, 0.88);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 11px;
      cursor: pointer;
    }

    .icon-btn svg,
    .player-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      display: block;
    }

    #collapsePlayerButton {
      margin-left: 2px;
    }

    #player.collapsed {
      padding: 8px 10px;
      border-radius: 17px;
    }

    #player.collapsed #playbackButtons,
    #player.collapsed audio {
      display: none;
    }

    #player.collapsed #nowPlayingArt {
      width: 44px;
      height: 44px;
    }

    #player.collapsed #nowPlayingArtist {
      display: none;
    }

    #player.collapsed #nowPlayingTitle {
      font-size: 13px;
    }

    #player.expanded .miniControls {
      display: none;
    }

    #player.expanded #collapsePlayerButton svg {
      transform: rotate(180deg);
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-wrap {
      display: grid;
      gap: 12px;
    }

    .settings-card {
      padding: 16px;
      border-radius: 17px;
      background: linear-gradient(145deg, rgba(24,28,38,.94), rgba(12,15,21,.94));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    .settings-card h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }

    .settings-card p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .theme-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid rgba(255,255,255,.055);
    }

    .theme-row:first-of-type {
      border-top: 0;
    }

    .theme-row label {
      color: #e7ebf3;
      font-size: 13px;
    }

    .theme-select {
      min-width: 132px;
      padding: 9px 10px;
      color: white;
      background: #222733;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px;
      outline: none;
    }

    .theme-preview {
      height: 78px;
      margin-top: 12px;

    /* =========================
       COLLAPSIBLE CONTROL PANEL

    ========================= */

      height: 38px;

      padding: 0;

      background: rgba(29,34,45,.84);

      height: 20px;

    #controlPanelBody {

      overflow: hidden;
      opacity: 1;
      transform: translateY(0);

        opacity .18s ease,
        transform .22s ease,
        margin-top .22s ease;

      padding-bottom: 8px;

      opacity: 0;
      transform: translateY(-8px);
      margin-top: 0;
      pointer-events: none;

      transform: rotate(180deg);

    #importDrawerBackdrop {

      inset: 0;
      z-index: 68;

      pointer-events: auto;

    #importDrawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 72;
      width: min(86vw, 350px);
      padding:
        calc(env(safe-area-inset-top) + 18px)
        18px
        calc(env(safe-area-inset-bottom) + 22px);
      overflow-y: auto;
      transform: translateX(calc(-100% - 30px));
      transition: transform .28s cubic-bezier(.2,.72,.2,1);
      background:
        radial-gradient(circle at 0% 24%, color-mix(in srgb, var(--theme-left) 25%, transparent), transparent 42%),

      box-shadow:
        18px 0 45px rgba(0,0,0,.62),

    }

    #importDrawer.open {
      transform: translateX(0);
    }

    #importDrawerHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    #importDrawerHeader h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: .02em;
    }

    #closeImportDrawerButton {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      color: white;
      background: rgba(32,37,49,.9);
      border: 1px solid color-mix(in srgb, var(--neon) 32%, rgba(255,255,255,.08));
      border-radius: 12px;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .import-drawer-copy {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .import-drawer-card {
      padding: 15px;
      border-radius: 16px;
      background:
        linear-gradient(135deg,
          color-mix(in srgb, var(--theme-left) 10%, rgba(24,29,40,.94)),
          color-mix(in srgb, var(--theme-right) 8%, rgba(20,24,34,.96))
        );
      border: 1px solid color-mix(in srgb, var(--neon) 32%, rgba(255,255,255,.08));
      box-shadow:
        inset 0 0 20px color-mix(in srgb, var(--neon) 7%, transparent),
        0 10px 24px rgba(0,0,0,.2);
    }

    .import-drawer-card label {
      display: block;
      margin-bottom: 9px;
      font-size: 12px;
      font-weight: 800;
      color: #eaf1fb;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    #importDrawer #fileInput {
      display: block !important;
      width: 100%;
      margin: 0;
      padding: 12px;
      color: #dce8f8;
      background: rgba(20,24,33,.94);
      border: 1px solid color-mix(in srgb, var(--neon) 30%, rgba(255,255,255,.08));
      border-radius: 13px;
    }

    .import-note {
      margin-top: 10px;
      color: #9da8ba;
      font-size: 11px;
      line-height: 1.45;
    }

    #importDrawerTab {
      position: fixed;
      left: 0;
      top: 46%;
      z-index: 67;
      min-width: 42px;
      padding: 13px 8px 12px;
      color: #f1f7ff;
      background:
        linear-gradient(180deg,
          color-mix(in srgb, var(--theme-left) 34%, rgba(15,20,30,.96)),
          color-mix(in srgb, var(--neon) 16%, rgba(12,16,25,.98))
        );
      border: 1px solid color-mix(in srgb, var(--neon) 62%, transparent);
      border-left: 0;
      border-radius: 0 12px 12px 0;
      writing-mode: vertical-rl;
      transform: translateY(-50%) rotate(180deg);
      letter-spacing: .15em;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        7px 0 20px color-mix(in srgb, var(--neon) 20%, transparent),
        inset 0 0 14px color-mix(in srgb, var(--neon) 10%, transparent);
    }

    #importDrawer.open + #importDrawerTab {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      #controlPanelHandle {
        min-height: 38px;
      }

      .control-panel-title {
        font-size: 11px;
      }

      #currentViewLabel {
        max-width: 112px;
      }

      #importDrawerTab {
        top: 52%;
      }
    }

  </style>
</head>

<body>

  <div id="ambientBackground" aria-hidden="true">

<script>

let db = null;

let songs = [];
let playlists = [];

let currentView = "library";

let importQueue = [];

let editorOpen = false;
let editorMode = null;

let pendingFile = null;
let editingSong = null;

let playlistTargetSongId = null;

let shouldReturnToPlaylistPicker = false;

let playbackQueue = [];
let currentQueueIndex = -1;

let shuffleEnabled = false;

let repeatMode = "off";


const fileInput =

};

  neon: "#35a7ff"
};

let atlasTheme = {

};

function hexToRgba(hex, alpha) {
  const value = hex.replace("#", "");
  const number = parseInt(value, 16);
  const r = (number >> 16) & 255;
  const g = (number >> 8) & 255;
  const b = number & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function applyTheme(theme) {
  atlasTheme = {
    ...DEFAULT_THEME,
    ...theme
  };

  const root = document.documentElement;
  root.style.setProperty(
    "--smoke-left",
    hexToRgba(atlasTheme.leftSmoke, 0.42)
  );
  root.style.setProperty(
    "--smoke-right",
    hexToRgba(atlasTheme.rightSmoke, 0.40)
  );
  root.style.setProperty(
    "--theme-left",
    atlasTheme.leftSmoke
  );
  root.style.setProperty(
    "--theme-right",
    atlasTheme.rightSmoke
  );
  root.style.setProperty(
    "--neon",
    atlasTheme.neon
  );
}

function saveTheme(theme) {
  localStorage.setItem(
    THEME_STORAGE_KEY,
    JSON.stringify(theme)
  );
  applyTheme(theme);
}

function loadTheme() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(THEME_STORAGE_KEY) || "null"
    );
    applyTheme(saved || DEFAULT_THEME);
  } catch (error) {
    applyTheme(DEFAULT_THEME);
  }
}

function colorOptions(selected) {
  return Object.entries(THEME_COLORS)
    .map(([name, value]) =>
      `<option value="${value}" ${value === selected ? "selected" : ""}>${name}</option>`

    .join("");
}

function openDatabase() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );

      request.onupgradeneeded =
        event => {

          const database =
            event.target.result;

          if (
            !database.objectStoreNames
              .contains(SONG_STORE)
          ) {

            database.createObjectStore(
              SONG_STORE,
              {
                keyPath: "id",
                autoIncrement: true
              }
            );

          }

          if (
            !database.objectStoreNames
              .contains(PLAYLIST_STORE)
          ) {

            database.createObjectStore(
              PLAYLIST_STORE,
              {
                keyPath: "id",
                autoIncrement: true
              }
            );

          }

        };

      request.onsuccess =
        event => {

          db =
            event.target.result;

          resolve();

        };

      request.onerror =
        () =>
          reject(request.error);

    }
  );

}


function getAll(storeName) {

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          storeName,
          "readonly"
        );

      const store =
        transaction.objectStore(
          storeName
        );

      const request =
        store.getAll();

      request.onsuccess =
        () =>
          resolve(request.result);

      request.onerror =
        () =>
          reject(request.error);

    }
  );

}

async function normalizeOldSongs() {

  const storedSongs =
    await getAll(
      SONG_STORE
    );

  for (const song of storedSongs) {

    let changed = false;

    if (
      song.customTitle &&
      song.customTitle.trim()
    ) {

      song.title =
        song.customTitle.trim();

      changed = true;

    }

    if (
      !song.title &&
      song.name
    ) {

      song.title =
        song.name;

      changed = true;

    }

    if (!song.title) {

      song.title =
        (
          song.filename ||
          "Unknown Song"
        )
        .replace(
          /\.mp3$/i,
          ""
        );

      changed = true;

    }

    if (
      song.artist === undefined
    ) {

      song.artist = "";
      changed = true;

    }

    if (
      song.album === undefined
    ) {

      song.album = "";
      changed = true;

    }

    if (
      song.artwork === undefined
    ) {

      song.artwork = "";
      changed = true;

    }

    if (changed) {

      await putRecord(
        SONG_STORE,
        {
          id:
            song.id,

          filename:
            song.filename,

          type:
            song.type ||
            "audio/mpeg",

          blob:
            song.blob,

          title:
            song.title,

          artist:
            song.artist,

          album:
            song.album,

          artwork:
            song.artwork
        }
      );

    }

  }

}

function readMetadata(file) {

  return new Promise(
    resolve => {

      if (
        typeof jsmediatags ===
        "undefined"
      ) {

        resolve({
          title:
            file.name.replace(
              /\.mp3$/i,
              ""
            ),

          artist: "",
          album: "",
          artwork: ""
        });

        return;

      }

      jsmediatags.read(
        file,
        {

          onSuccess:
            result => {

              const tags =
                result.tags || {};

              let artwork = "";

              try {

                if (
                  tags.picture &&
                  tags.picture.data
                ) {

                  let binary = "";

                  for (
                    let i = 0;
                    i <
                    tags.picture.data.length;
                    i++
                  ) {

                    binary +=
                      String.fromCharCode(
                        tags.picture.data[i]
                      );

                  }

                  artwork =
                    "data:" +
                    tags.picture.format +
                    ";base64," +
                    btoa(binary);

                }

              } catch (error) {

                console.warn(error);

              }

              resolve({
                title:
                  tags.title ||
                  file.name.replace(
                    /\.mp3$/i,
                    ""
                  ),

                artist:
                  tags.artist || "",

                album:
                  tags.album || "",

                artwork
              });

            },

          onError:
            () => {

              resolve({
                title:
                  file.name.replace(
                    /\.mp3$/i,
                    ""
                  ),

                artist: "",
                album: "",
                artwork: ""
              });

            }

        }
      );

    }
  );

}


function prepareCoverArt(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        event => {

          const image =
            new Image();

          image.onload =
            () => {

              const maxSize =
                800;

              let width =
                image.width;

              let height =
                image.height;

              if (
                width > maxSize ||
                height > maxSize
              ) {

                const scale =
                  Math.min(
                    maxSize / width,
                    maxSize / height
                  );

                width =
                  Math.round(
                    width * scale
                  );

                height =
                  Math.round(
                    height * scale
                  );

              }

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width = width;
              canvas.height = height;

              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );

              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.85
                )
              );

            };

          image.onerror =
            reject;

          image.src =
            event.target.result;

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

function getArtworkType(src) {
  if (!src || !src.startsWith("data:")) {
    return "image/png";
  }

  const match = src.match(/^data:([^;,]+)/i);
  return match ? match[1] : "image/jpeg";
}


function updateMediaSession(song) {
  if (!("mediaSession" in navigator) || !("MediaMetadata" in window)) {
    return;
  }

  const artworkSource =
    song.artwork ||
    new URL("./icon-512.png", window.location.href).href;

  try {
    navigator.mediaSession.metadata =
      new MediaMetadata({
        title:
          song.title ||
          song.filename ||
          "Unknown Song",
        artist:
          song.artist ||
          "Unknown Artist",
        album:
          song.album ||
          "ATLAS Music",
        artwork: [
          {
            src: artworkSource,
            type: getArtworkType(artworkSource)
          }
        ]
      });
  } catch (error) {
    console.warn(
      "Media Session metadata could not be updated.",
      error
    );
  }
}


function updateMediaPositionState() {
  if (!("mediaSession" in navigator)) {
    return;
  }

  if (
    !Number.isFinite(audioPlayer.duration) ||
    audioPlayer.duration <= 0
  ) {
    return;
  }

  try {
    navigator.mediaSession.setPositionState({
      duration: audioPlayer.duration,
      playbackRate: audioPlayer.playbackRate || 1,
      position: Math.min(
        audioPlayer.currentTime,
        audioPlayer.duration
      )
    });
  } catch (error) {
    // Some Safari/iOS versions expose Media Session
    // without supporting position state completely.
  }
}

function playSong(
  song,
  queue = null
) {

  if (queue) {

    playbackQueue =
      [...queue];

  } else if (
    playbackQueue.length === 0
  ) {

    playbackQueue =
      [...songs];

  }

  currentQueueIndex =
    playbackQueue.findIndex(
      item =>
        item.id ===
        song.id
    );

  if (
    currentQueueIndex === -1
  ) {

    playbackQueue =
      [song];

    currentQueueIndex =
      0;

  }

  audioPlayer.src =
    song.url;

  updateNowPlaying(song);

  audioPlayer.play()
    .catch(
      error =>
        console.warn(
          error
        )
    );

  renderCurrentView();

}


function playQueueIndex(index) {

  if (
    playbackQueue.length === 0
  ) {
    return;
  }

  if (
    index < 0 ||
    index >=
    playbackQueue.length
  ) {
    return;
  }

  const song =
    playbackQueue[index];

  currentQueueIndex =
    index;

  audioPlayer.src =
    song.url;

  updateNowPlaying(song);

  audioPlayer.play()
    .catch(
      error =>
        console.warn(error)
    );

  renderCurrentView();

}


function getRandomQueueIndex() {

  if (
    playbackQueue.length <= 1
  ) {
    return 0;
  }

  let randomIndex =
    currentQueueIndex;

  while (
    randomIndex ===
    currentQueueIndex
  ) {

    randomIndex =
      Math.floor(
        Math.random() *
        playbackQueue.length
      );

  }

  return randomIndex;

}


function playNext() {

  if (
    playbackQueue.length === 0
  ) {
    return;
  }

  if (shuffleEnabled) {

    playQueueIndex(
      getRandomQueueIndex()
    );

    return;

  }

  const nextIndex =
    currentQueueIndex + 1;

  if (
    nextIndex <
    playbackQueue.length
  ) {

    playQueueIndex(
      nextIndex
    );

  } else if (
    repeatMode === "all"
  ) {

    playQueueIndex(0);

  }

}


function playPrevious() {

  if (
    playbackQueue.length === 0
  ) {
    return;
  }

  if (
    audioPlayer.currentTime > 3
  ) {

    audioPlayer.currentTime = 0;

    return;

  }

  if (shuffleEnabled) {

    playQueueIndex(
      getRandomQueueIndex()
    );

    return;

  }

  const previousIndex =
    currentQueueIndex - 1;

  if (
    previousIndex >= 0
  ) {

    playQueueIndex(
      previousIndex
    );

  } else if (
    repeatMode === "all"
  ) {

    playQueueIndex(
      playbackQueue.length - 1
    );

  }

}

function setupMediaSessionControls() {
  if (!("mediaSession" in navigator)) {
    return;
  }

  const handlers = {
    play: () => audioPlayer.play().catch(console.warn),
    pause: () => audioPlayer.pause(),
    previoustrack: () => playPrevious(),
    nexttrack: () => playNext()
  };

  Object.entries(handlers).forEach(
    ([action, handler]) => {
      try {
        navigator.mediaSession.setActionHandler(
          action,
          handler
        );
      } catch (error) {
        console.warn(
          `Media action ${action} is not supported.`,
          error
        );
      }
    }
  );

  ["seekbackward", "seekforward"].forEach(
    action => {
      try {
        navigator.mediaSession.setActionHandler(
          action,
          null
        );
      } catch (error) {
        // Ignore unsupported actions.
      }
    }
  );
}

      repeatButton.textContent =
        "Repeat: All";

      repeatButton
        .classList
        .add("active");

    } else if (
      repeatMode === "all"
    ) {

      repeatMode = "one";

      repeatButton.textContent =
        "Repeat: One";

    } else {

      repeatMode = "off";

      repeatButton.textContent =
        "Repeat: Off";

      repeatButton
        .classList
        .remove("active");

    }

  };

  );

function blobToDataURL(blob) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(reader.result);

      reader.onerror =
        () => reject(reader.error);

      reader.readAsDataURL(blob);

    }
  );

}


function dataURLToBlob(dataURL) {

  const parts =
    dataURL.split(",");

  if (parts.length < 2) {

    throw new Error(
      "Invalid backup audio data."
    );

  }

  const header =
    parts[0];

  const base64 =
    parts.slice(1).join(",");

  const mimeMatch =
    header.match(
      /^data:([^;]+);base64$/
    );

  const mimeType =
    mimeMatch
      ? mimeMatch[1]
      : "audio/mpeg";

  const binary =
    atob(base64);

  const bytes =
    new Uint8Array(
      binary.length
    );

  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);

  }

  return new Blob(
    [bytes],
    {
      type: mimeType
    }
  );

}


function clearStore(storeName) {

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          storeName,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          storeName
        );

      const request =
        store.clear();

      request.onsuccess =
        () => resolve();

      request.onerror =
        () =>
          reject(request.error);

    }
  );

}


async function exportLibraryBackup() {

  if (
    songs.length === 0 &&
    playlists.length === 0
  ) {

    alert(
      "There is nothing to back up yet."
    );

    return;

  }

  exportBackupButton.disabled =
    true;

  restoreBackupButton.disabled =
    true;

  const oldStatus =
    statusText.textContent;

  statusText.textContent =
    "Creating backup...";

  try {

    const storedSongs =
      await getAll(
        SONG_STORE
      );

    const storedPlaylists =
      await getAll(
        PLAYLIST_STORE
      );

    const backupSongs = [];

    for (
      let i = 0;
      i < storedSongs.length;
      i++
    ) {

      statusText.textContent =
        "Backing up song " +
        (i + 1) +
        " of " +
        storedSongs.length +
        "...";

      const song =
        storedSongs[i];

      const audioData =
        await blobToDataURL(
          song.blob
        );

      backupSongs.push({
        id:
          song.id,

        filename:
          song.filename,

        type:
          song.type ||
          "audio/mpeg",

        title:
          song.title ||
          "",

        artist:
          song.artist ||
          "",

        album:
          song.album ||
          "",

        artwork:
          song.artwork ||
          "",

        audioData
      });

    }

    const backup = {
      format:
        "ATLAS_MUSIC_BACKUP",

      version:
        1,

      createdAt:
        new Date().toISOString(),

      songs:
        backupSongs,

      playlists:
        storedPlaylists
    };

    const backupBlob =
      new Blob(
        [
          JSON.stringify(
            backup
          )
        ],
        {
          type:
            "application/json"
        }
      );

    const url =
      URL.createObjectURL(
        backupBlob
      );

    const link =
      document.createElement(
        "a"
      );

    const date =
      new Date()
        .toISOString()
        .slice(0, 10);

    link.href = url;

    link.download =
      "ATLAS-Music-Backup-" +
      date +
      ".atlasmusic";

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    setTimeout(
      () =>
        URL.revokeObjectURL(
          url
        ),
      1000
    );

    statusText.textContent =
      "Backup downloaded.";

  } catch (error) {

    console.error(error);

    statusText.textContent =
      oldStatus;

    alert(
      "ATLAS Music could not create the backup."
    );

  } finally {

    exportBackupButton.disabled =
      false;

    restoreBackupButton.disabled =
      false;

  }

}


async function restoreLibraryBackup(
  file
) {

  if (!file) {
    return;
  }

  let backup;

  try {

    const raw =
      await file.text();

    backup =
      JSON.parse(raw);

  } catch (error) {

    console.error(error);

    alert(
      "That file is not a valid ATLAS Music backup."
    );

    return;

  }

  if (
    !backup ||
    backup.format !==
      "ATLAS_MUSIC_BACKUP" ||
    backup.version !== 1 ||
    !Array.isArray(
      backup.songs
    ) ||
    !Array.isArray(
      backup.playlists
    )
  ) {

    alert(
      "That file is not a valid ATLAS Music backup."
    );

    return;

  }

  const confirmed =
    confirm(
      "Restore this backup?\n\n" +
      "This will replace the library stored in this version of ATLAS Music with " +
      backup.songs.length +
      " song" +
      (
        backup.songs.length === 1
          ? ""
          : "s"
      ) +
      " and " +
      backup.playlists.length +
      " playlist" +
      (
        backup.playlists.length === 1
          ? ""
          : "s"
      ) +
      "."
    );

  if (!confirmed) {
    return;
  }

  exportBackupButton.disabled =
    true;

  restoreBackupButton.disabled =
    true;

  statusText.textContent =
    "Restoring backup...";

  try {

    const restoredSongs = [];

    for (
      let i = 0;
      i < backup.songs.length;
      i++
    ) {

      statusText.textContent =
        "Preparing song " +
        (i + 1) +
        " of " +
        backup.songs.length +
        "...";

      const song =
        backup.songs[i];

      restoredSongs.push({
        id:
          song.id,

        filename:
          song.filename ||
          (
            song.title
              ? song.title + ".mp3"
              : "song.mp3"
          ),

        type:
          song.type ||
          "audio/mpeg",

        blob:
          dataURLToBlob(
            song.audioData
          ),

        title:
          song.title ||
          song.filename ||
          "Unknown Song",

        artist:
          song.artist ||
          "",

        album:
          song.album ||
          "",

        artwork:
          song.artwork ||
          ""
      });

    }

    await clearStore(
      SONG_STORE
    );

    await clearStore(
      PLAYLIST_STORE
    );

    for (
      const song of restoredSongs
    ) {

      await putRecord(
        SONG_STORE,
        song
      );

    }

    for (
      const playlist of
      backup.playlists
    ) {

      await putRecord(
        PLAYLIST_STORE,
        {
          id:
            playlist.id,

          name:
            playlist.name ||
            "Playlist",

          songIds:
            Array.isArray(
              playlist.songIds
            )
              ? playlist.songIds
              : []
        }
      );

    }

    playbackQueue = [];
    currentQueueIndex = -1;

    audioPlayer.pause();
    audioPlayer.removeAttribute(
      "src"
    );
    audioPlayer.load();

    nowPlayingTitle.textContent =
      "Nothing playing";

    nowPlayingArtist.textContent =
      "";

    nowPlayingArt.removeAttribute(
      "src"
    );

    currentView =
      "library";

    openPlaylistId =
      null;

    await refreshData();

    statusText.textContent =
      "Backup restored successfully.";

    alert(
      "ATLAS Music backup restored successfully."
    );

  } catch (error) {

    console.error(error);

    alert(
      "The backup could not be restored."
    );

    try {

      await refreshData();

    } catch (
      refreshError
    ) {

      console.error(
        refreshError
      );

    }

  } finally {

    exportBackupButton.disabled =
      false;

    restoreBackupButton.disabled =
      false;

    restoreBackupInput.value =
      "";

  }

}


exportBackupButton.onclick =
  exportLibraryBackup;


restoreBackupButton.onclick =
  () => {

    restoreBackupInput.click();

  };


restoreBackupInput.addEventListener(
  "change",
  async () => {

    const file =
      restoreBackupInput.files[0];

    await restoreLibraryBackup(
      file
    );

  }
);


async function startApp() {

  try {

    statusText.textContent =
      "Loading library...";

    loadTheme();
    restorePlayerState();
    restoreControlPanelState();
    setupMediaSessionControls();
    updateMiniPlayIcon();

    await openDatabase();

    await normalizeOldSongs();

    await refreshData();

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "Database error";

    alert(
      "ATLAS Music could not load its database."
    );

  }

}


startApp();


if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    () => {

      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )
        .then(
          () =>
            console.log(
              "ATLAS Music service worker registered."
            )
        )
        .catch(
          error =>
            console.error(
              "Service worker registration failed:",
              error
            )
        );

    }
  );

}

</script>
